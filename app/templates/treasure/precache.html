<!doctype html>
<html>
<head>
  {% include "_head.html" %}
  <title>Treasure Cruise • Preparing Session</title>
  <link rel="stylesheet" href="/static/css/treasure.css">
</head>
<body>
  {% include "_nav.html" %}

  <main
    id="tc-precache"
    class="container tc-precache stack-16"
    data-sid="{{ sid }}"
  >
    <header>
      <h1>Preparing Your Session</h1>
      <p class="muted tc-help">
        We’re fetching card images from Scryfall and caching them locally. This happens only once per deck.
      </p>
    </header>

    <section class="card stack-12 tc-precache-card">
      <div class="row tc-precache-row">
        <div class="k">Session code</div>
        <code id="pc-sid">{{ sid }}</code>
      </div>

      <div class="pc-bar">
        <div class="pc-fill" id="pc-fill"></div>
      </div>

      <div class="row tc-precache-row">
        <div class="pc-num">
          <span id="pc-done">0</span>
          <span class="muted"> / </span>
          <span id="pc-total">0</span>
        </div>
        <div id="pc-status" class="muted">Starting…</div>
      </div>

      <div id="pc-actions" class="pc-actions">
        <a class="btn" id="pc-open" href="/treasure/{{ sid }}">Open Session</a>
      </div>
    </section>
  </main>

  <script src="/static/js/treasure.js"></script>
</body>
</html>
