<!doctype html>
<html>
<head>
  {% include "_head.html" %}
  <title>Treasure Cruise • Session</title>
  <link rel="stylesheet" href="/static/css/treasure.css">
</head>
<body>
  {% include "_nav.html" %}

  <main
    class="container stack-16 tc-session"
    id="tc-root"
    data-sid="{{ sid }}"
  >
    <!-- Top bar: session code + players -->
    <section class="tc-session-header">
      <div class="tc-session-top">
        <div class="tc-session-code">
          <span class="muted k">Session code</span>
          <code id="tc-sid">{{ sid }}</code>
          <button class="btn btn--small btn--ghost" id="tc-sid-copy" type="button">
            Copy
          </button>
        </div>
        <div class="tc-session-players">
          <div id="tc-players" class="row"></div>
        </div>
      </div>

      <div class="tc-session-title">
        <h1>Treasure Cruise • Session</h1>
        <p class="muted" id="tc-turnlabel">Turn —</p>
      </div>
    </section>

    <!-- Top of deck -->
    <section class="card stack-12 tc-section">
      <div class="tc-section-header">
        <h2 class="tc-section-title">Top of Deck</h2>
        <p class="tc-section-caption muted">Latest reveal</p>
      </div>
      <div id="tc-deck" class="tc-cards"></div>
    </section>

    <!-- Active player's cards -->
    <section class="card stack-12 tc-section">
      <div class="tc-section-header">
        <h2 class="tc-section-title">Active Player’s Cards</h2>
        <p class="tc-section-caption muted">Auto-updates on turn</p>
      </div>
      <div id="tc-hand" class="tc-cards"></div>
    </section>

    <!-- Log -->
    <section class="card tc-section">
      <header class="tc-section-header">
        <h2 class="tc-section-title">Log</h2>
        <button class="log__toggle" id="tc-log-toggle" type="button">
          Show all
        </button>
      </header>
      <div class="log__box" id="tc-logbox"></div>
    </section>
  </main>

  <!-- Sticky action bar -->
  <div class="sticky-bottom">
    <div class="container">
      <div class="actionbar">
        <button class="btn" id="tc-roll" type="button">
          Pay — • Roll d6
        </button>
        <button class="btn btn--ghost" id="tc-pass" type="button">
          Pass turn
        </button>
        <button class="btn btn--ghost btn--danger" id="tc-end" type="button">
          End game
        </button>
      </div>
    </div>
  </div>

  <script src="/static/js/treasure.js"></script>
</body>
</html>
