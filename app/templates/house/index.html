{% extends "base.html" %}

{% block title %}Mr. House{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="/static/css/house.css">
{% endblock %}

{% block content %}

<!-- Sticky summary bar (JS updates by id) -->
<div class="summary">
  <span><span class="k">Iter:</span> <span class="v" id="s-iters">—</span></span>
  <span><span class="k">R:</span> <span class="v" id="s-robots">—</span></span>
  <span><span class="k">T:</span> <span class="v" id="s-treas">—</span></span>
  <span><span class="k">PB Cntrs:</span> <span class="v" id="s-counters">—</span></span>
  <span><span class="k">Mana:</span> <span class="v" id="s-mana">—</span></span>
  <button class="btn btn--ghost" id="copySummaryBtn" type="button">Copy</button>
</div>

<section class="container page house">
  <h1 class="house-title">Mr. House’s Puzzlebox Simulator</h1>

  <div class="house-layout">
    <!-- LEFT: Controls -->
    <div class="card house-card house-controls">
      <form id="simForm" class="stack-16">
        <div class="field">
          <label for="untapped_other_init">Untapped artifacts (excluding Puzzlebox)</label>
          <input id="untapped_other_init" name="untapped_other_init" type="number" min="0" value="0" />
          <div class="chips">
            <button type="button" class="chip" data-plus="2">+2</button>
            <button type="button" class="chip" data-plus="5">+5</button>
            <button type="button" class="chip" data-plus="10">+10</button>
            <button type="button" class="chip" data-set="0">Set 0</button>
          </div>
        </div>

        <div>
          <h2 class="section-title">Board Modifiers</h2>
          <div class="checkbox-row mod-row">
            <input id="delney" name="delney" type="checkbox" />
            <label for="delney" style="margin:0;">Delney, Streetwise Lookout (double Mr. House trigger)</label>
          </div>
        </div>

        <div>
          <h2 class="section-title">Stop Conditions</h2>

          <div class="checkbox-row">
            <input id="stop_ge_100" name="stop_ge_100" type="checkbox" />
            <label for="stop_ge_100" style="margin:0;">Stop at PB counters ≥ 100</label>
          </div>

          <div class="field">
            <label for="stop_treasures_ge">Stop at total Treasures ≥</label>
            <input id="stop_treasures_ge" name="stop_treasures_ge" type="number" min="0" placeholder="—" />
          </div>

          <div class="field">
            <label for="stop_robots_ge">Stop at total Robots ≥</label>
            <input id="stop_robots_ge" name="stop_robots_ge" type="number" min="0" placeholder="—" />
          </div>

          <div class="field">
            <label for="stop_mana_ge">Stop at PB Mana ≥</label>
            <input id="stop_mana_ge" name="stop_mana_ge" type="number" min="0" placeholder="—" />
          </div>
        </div>

        <div class="field">
          <label for="seed">Seed (optional)</label>
          <input id="seed" name="seed" type="number" placeholder="—" />
        </div>

        <div class="row">
          <button id="runBtn" class="btn btn--primary" type="submit">Run Simulation</button>
          <div id="runNote" class="hint"></div>
        </div>
      </form>
    </div>

    <!-- RIGHT: Results (JS will render into this) -->
    <div class="house-results">
      <div id="resultsMount" class="stack-12"></div>
    </div>
  </div>

  <!-- Optional server-bootstrapped result (JS reads #result[data-json]) -->
  <div id="result" data-json=""></div>
</section>

{% endblock %}

{% block scripts %}
  <script src="/static/js/base.js"></script>
  <script src="/static/js/house.js"></script>
{% endblock %}
